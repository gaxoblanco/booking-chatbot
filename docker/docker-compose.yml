# ==================================================
# WHATSAPP BOT - DOCKER COMPOSE
# ==================================================
# Orchestrates the WhatsApp webhook service
# Run with: docker-compose up --build

services:
  # ==================================================
  # WHATSAPP WEBHOOK SERVICE
  # ==================================================
  whatsapp-demo:
    # Build from local Dockerfile
    # Context es la raíz del proyecto, no docker/
    build:
      context: ..
      dockerfile: docker/Dockerfile

    # Container name
    container_name: whatsapp-demo

    # Restart policy
    restart: unless-stopped

    # Port mapping: host:container
    ports:
      - "5001:5000"

    # Environment variables from .env file
    env_file:
      - .env

    environment:
      - TZ=America/Argentina/Buenos_Aires
      - DOMAIN_PRESET=${DOMAIN_PRESET:-SALUD} # Default: SALUD
      - PYTHONPATH=/app
      # Access keys configuration
      - MASTER_ACCESS_KEY=${MASTER_ACCESS_KEY:-}
      - ALLOW_KEY_REUSE=${ALLOW_KEY_REUSE:-false}
      # Environment mode (development/production)
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - FLASK_ENV=${FLASK_ENV:-development}
      # WhatsApp Templates
      - TWILIO_REMINDER_TEMPLATE_SID=${TWILIO_REMINDER_TEMPLATE_SID:-}
      - TWILIO_SLOT_OFFER_TEMPLATE_SID=${TWILIO_SLOT_OFFER_TEMPLATE_SID:-}

    # Volume mounts (desde raíz del proyecto)
    volumes:
      # Mount database (persistent storage)
      - ../data/db:/app/data

      # Mount conversations logs (persistent storage para ML)
      - conversations:/app/data/conversations

      # Mount dataset (persistent storage para entrenamiento ML)
      - dataset:/app/dataset

      # Mount modelo ML entrenado
      - ../scripts/ml/models:/app/scripts/ml/models

      # Mount source code for hot reload in development
      # Comment out for production
      - ../src:/app/src

      # Mount scripts (if needed for debugging)
      - ../scripts:/app/scripts

      # Mount test
      - ../tests:/app/tests

      # Mount Google Calendar credentials
      - ../src/integrations/google_calendar_service:/app/src/integrations/google_calendar_service

      # Montar carpeta data/ completa (CSV de carga y datos demo)
      - ../data:/app/data/csv
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network mode
    networks:
      - whatsapp-demo-network

# ==================================================
# NETWORKS
# ==================================================
networks:
  whatsapp-demo-network:
    driver: bridge

# ==================================================
# VOLUMES
# ==================================================
volumes:
  database:
    driver: local

  # Conversaciones recopiladas para ML
  # Contiene archivos JSONL con logs de cada mensaje procesado
  conversations:
    driver: local

  # Dataset limpio para entrenamiento ML
  # Contiene datos revisados y validados manualmente
  dataset:
    driver: local

# ==================================================
# USAGE INSTRUCTIONS
# ==================================================
# 1. Copy .env.example to .env and fill in credentials
# 2. Configure access keys in src/config/config.py
# 3. Build and start: docker-compose up --build
# 4. Stop: docker-compose down
# 5. View logs: docker-compose logs -f whatsapp-demo
# 6. Restart: docker-compose restart whatsapp-demo
# 7. Generate keys: docker-compose exec whatsapp-demo python scripts/generate_access_keys.py
#
# For production:
# - Remove volume mounts for source code
# - Use gunicorn in Dockerfile
# - Set FLASK_ENV=production in .env
# - Load keys from environment variables or encrypted file